<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <link rel="stylesheet" href="output.css">
</head>

<body class="font">
    <header class="bg-black">
        <ul class="flex bg-black *:p-5 p-5  text-white *:hover:border-red-600 *:hover:border-b-8 text-2xl justify-end">
            <li>Home</li>
            <li>Products</li>
            <li>Services</li>
            <li>About Us</li>
            <li>Contact us</li>
        </ul>
    </header>

    <div class="grid grid-cols-2 md:grid-cols-3">
        <div class="bg-pink-300 p-10 border-red-700 border-2">1</div>
        <div class="bg-pink-300 p-10 border-red-700 border-2">2</div>
        <div class="bg-pink-300 p-10 border-red-700 border-2">3</div>
        <div class="bg-pink-300 p-10 border-red-700 border-2">4</div>
        <div class="bg-pink-300 p-10 border-red-700 border-2">5</div>
        <div class="bg-pink-300 p-10 border-red-700 border-2">6</div>
        <div class="bg-pink-300 p-10 border-red-700 border-2">7</div>
        <div class="bg-pink-300 p-10 border-red-700 border-2">8</div>
        <div class="bg-pink-300 p-10 border-red-700 border-2">9</div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3">
        <div class="bg-cyan-600 border-yellow-600 border-2">1</div>
        <div class="bg-cyan-600 border-green-600 border-2">2</div>
        <div class="bg-cyan-600 border-yellow-600 border-2">3</div>
        <div class="bg-cyan-600 border-yellow-600 border-2">4</div>
        <div class="bg-cyan-600 border-yellow-600 border-2">5</div>
        <div class="bg-cyan-600 border-yellow-600 border-2">6</div>
        <div class="bg-cyan-600 border-yellow-600 border-2">7</div>
        <div class="bg-cyan-600 border-yellow-600 border-2">8</div>
        <div class="bg-cyan-600 border-yellow-600 border-2">9</div>

    </div>

</body>

</html>
