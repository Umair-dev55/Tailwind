<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>interactivity</title>
    <link rel="stylesheet" href="output.css">
</head>

<body>
    <div class="p-5">

        <button class="bg-amber-500 p-2 rounded-md ">Login</button>
        <button class="bg-amber-500 p-2 hover:px-3 rounded-md  ">hover</button>
        <button class="bg-amber-500 p-2 active:px-3 rounded-md  ">Active</button>
        <button class="bg-amber-500 rounded-md p-2 focus:px-3  ">focus</button>

        <!-- everything in one button -->
        <button class="p-3 bg-amber-500 rounded-md hover:bg-amber-600 focus:px-4 active:bg-amber-700 ">focus</button>
        <!-- Group Hover -->
        <div class="group ">
            <button class="bg-black text-white p-4 rounded-md group-hover:bg-yellow-600">Group 1</button>
            <button class="bg-black text-white p-4 rounded-md group-hover:bg-yellow-600">Group 2</button>

        </div>
    </div>
</body>

</html>
