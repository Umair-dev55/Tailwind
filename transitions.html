<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transitions</title>
    <link rel="stylesheet" href="output.css">
</head>

<body>
    <button class="p-2 bg-blue-500 text-white m-10 rounded hover:bg-blue-800">
        Login</button>
    <button class="p-2 bg-blue-500 text-white m-10 rounded hover:bg-blue-800
    transition duration-1000
    ">
        Sign Up</button>

    <button class="p-2 bg-pink-500 text-white m-10 rounded 
    hover:rotate-45 transition-transform duration-1000">
        Rotate</button>
    <button class="p-2 bg-pink-500 text-white m-10 rounded 
    hover:transition hover:scale-150 duration-1000">
        Rotate</button>
    <div>
        <img class="transition-transform duration-1000 hover:rotate-360" src="/car.jpg" alt="">
    </div>

</body>

</html>
