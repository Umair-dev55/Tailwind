<!DOCTYPE html>
<html lang="en">

<head>
    <title>Positions</title>
    <link rel="stylesheet" href="output.css">
</head>

<body class=" text-white">
    <div class=" h-screen mb-10  border-amber-50 border-8">
        <div class="bg-pink-400 size-20 absolute top-0 left-0"></div>
        <div class="bg-pink-400 size-20 absolute top-0 right-0"></div>
        <div class="bg-pink-400 size-20 absolute bottom-0 right-0"></div>
        <div class="bg-pink-400 size-20 absolute bottom-0 left-0"></div>

    </div>

    <!-- Position in every corner  -->

    <!-- now if we add one box and in this box paste 4 boxes in edges -->
    <div class="h-screen border-amber-50 border-8">
        <div class="bg-purple-600 relative size-100">
            <div class="bg-pink-400 size-20 absolute top-0 left-0"></div>
            <div class="bg-pink-400 size-20 absolute top-0 right-0"></div>
            <div class="bg-pink-400 size-20 absolute bottom-0 right-0"></div>
            <div class="bg-pink-400 size-20 absolute bottom-0 left-0"></div>
        </div>
    </div>
    <div class="border-amber-50 border-8">
        <div class="size-100 bg-emerald-400 relative">
            <div class="bg-gray-500 size-40 inset-50 absolute"></div>
        </div>
    </div>
    <!-- whatsapp icon fixed  -->
    <div>
        <h1 class="bg-white size-20 fixed bottom-20 right-20 mask-circle"><img
                src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/WhatsApp.svg/512px-WhatsApp.svg.png"
                alt="Whatsapp"></h1>
    </div>
    <div class="bg-black size-100 text-emerald-700">
        <div class="bg-blue-700 text-white text-2xl fixed top-50">Welcome</div>
    </div>

</body>

</html>
