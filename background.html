<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BackGround</title>
    <link rel="stylesheet" href="output.css">
</head>

<body>
    <!-- Add image in background -->
    <div
        class="bg-pink-400 h-100 bg-center  bg-[url('https://i.pinimg.com/1200x/f9/ba/67/f9ba67df1a0ce3e926e9cc01bdd2e336.jpg')] bg-no-repeat bg-contain">
        Hello tailwind
    </div>
    <!-- Add Gradiant  -->
    <div class="bg-linear-to-t from-yellow-500 to-red-500 h-screen">
        Umair
    </div>
    <!-- Outer shadow apply in box  -->
    <div class="p-20">
        <div class="bg-sky-500 size-50 mb-20 p-20 shadow-amber-600 shadow-2xl"></div>
    </div>
    <!-- Inner shadow apply in box  -->
    <div class="p-20">
        <div class="bg-white size-50 mb-20 p-20 shadow-amber-600 shadow-inner"></div>
    </div>


</body>

</html>
