<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min-Max width</title>
    <link rel="stylesheet" href="output.css">
</head>

<body>
    <div class="*:m-2">
        <!-- Min & Max -->
        <h1 class="bg-pink-500 w-50">Code step by step</h1>
        <h1 class="bg-pink-500 max-w-55">Code step by step</h1>
        <h1 class="bg-pink-500 min-w-80">Code step by step</h1>
        <!-- Full & 50 % -->
        <h1 class="bg-pink-500 w-full">Code step by step</h1>
        <h1 class="bg-pink-500 w-1/2">Code step by step</h1>
        <h1 class="bg-pink-500 w-1/3">Code step by step</h1>
        <h1 class="bg-pink-500 w-1/4">Code step by step</h1>
        <h1 class="bg-pink-500 w-1/5">Code step by step</h1>
        <h1 class="bg-pink-500 w-1/6">Code step by step</h1>
        <h1 class="bg-pink-500 w-1/7">Code step by step</h1>
        <h1 class="bg-pink-500 w-1/8">Code step by step</h1>
        <h1 class="bg-pink-500 w-1/9">Code step by step</h1>
        <h1 class="bg-pink-500 w-1/10">Code step by step</h1>

        <!-- //Now testing -->
         

    </div>

</body>

</html>
